<html>

<head>
    <title>SPA gatti casuali</title>
    <!-- css -->
    <style>
        .divimmaginegatto {
            text-align: center;
        }

        #gattocasuale {
            height: 400px;
            width: auto;
        }

        .btn {
            font-size: 24px;
            background: rgb(166, 166, 230);
            border: 1px solid #222020;
            padding: 6px;
            border-radius: 6px;
            margin: 20px;
        }

        #divbottoni {
            display: flex;
            justify-content: center;
        }

        #divsalvagatti {
            margin: 50px;
            border: 5px solid #222020;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }

        #divsalvagatti img {
            height: 120px;
            margin: 7px;
        }
    </style>
</head>

<body>
    <div id="divbottoni">
        <button id="btngattonuovo" class="btn">nuovo gatto</button>
        <button id="btnsalvagatto" class="btn">salva gatto</button>
    </div>
    <div class="divimmaginegatto">
        <img id="gattocasuale" src="" alt="">
    </div>

    <div id="divsalvagatti">

    </div>

    <script>
        const imgGattoCasuale = document.getElementById("gattocasuale");
        const btngattonuovo = document.getElementById("btngattonuovo");
        const btnsalvagatto = document.getElementById("btnsalvagatto");
        const divsalvagatti = document.getElementById("divsalvagatti");
        async function getRandomCat() {
            const url = "https://cataas.com/cat?json=true";
            const response = await fetch(url);
            console.log(response);
            if (response.ok) {
                const body = await response.json();
                console.log(body);
                imgGattoCasuale.src = body.url;
            }
        }

        async function salvagatto() {
            const nuovaimg = document.createElement("img");
            nuovaimg.src = imgGattoCasuale.src;
            divsalvagatti.append(nuovaimg);
        }

        btngattonuovo.addEventListener("click", getRandomCat);
        getRandomCat();

        btnsalvagatto.addEventListener("click", salvagatto);
    </script>
</body>

</html>
